# Verify and build in parallel; publish the exact built image only after both
# succeed, then ask the external platform to deploy it on real main pushes.
# The hook only triggers that platform: this workflow never replaces
# containers, runs migrations or verifies production itself.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: spelltype:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_ID=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/spelltype-image.tar
          cache-from: type=gha,scope=spelltype-amd64
          cache-to: type=gha,mode=max,scope=spelltype-amd64
      - name: Stage image for publication
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: spelltype-image
          path: ${{ runner.temp }}/spelltype-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [verify, image]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spelltype-image
          path: ${{ runner.temp }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/spelltype-image.tar
          IMAGE_TAGS: ${{ needs.image.outputs.tags }}
        run: |
          docker load --input "$IMAGE_ARCHIVE"
          while IFS= read -r tag; do
            docker tag spelltype:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          first_tag="${IMAGE_TAGS%%$'\n'*}"
          image_ref="$(docker image inspect "$first_tag" --format '{{json .RepoDigests}}' |
            jq -er --arg repository "${first_tag%:*}" '.[] | select(startswith($repository + "@"))')"
          {
            echo '## Published image'
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            printf '%s\n' "$image_ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Ask the external platform (Dokploy) to deploy the image just published. The
  # hook URL is a bearer capability, so it lives only in the repository secret
  # and is never echoed. Tags, PRs and manual runs on other branches do not
  # deploy; main runs are serialised by the workflow concurrency group.
  deploy:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger production deployment
        env:
          DEPLOYMENT_HOOK_URL: ${{ secrets.DEPLOYMENT_HOOK_URL }}
        run: |
          if [ -z "$DEPLOYMENT_HOOK_URL" ]; then
            echo "::error::DEPLOYMENT_HOOK_URL repository secret is not set; production was not triggered."
            exit 1
          fi
          invoke() {
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request "$1" --max-time 60 "$DEPLOYMENT_HOOK_URL"
          }
          # POST first; a 405 is the platform telling us this hook is GET-only.
          if ! status="$(invoke POST)"; then
            echo "::error::Deployment hook is unreachable; production was not triggered."
            exit 1
          fi
          if [ "$status" = "405" ]; then
            if ! status="$(invoke GET)"; then
              echo "::error::Deployment hook is unreachable; production was not triggered."
              exit 1
            fi
          fi
          case "$status" in
            2??) echo "Deployment hook accepted the request (HTTP $status)." ;;
            *) echo "::error::Deployment hook returned HTTP $status; production was not triggered."; exit 1 ;;
          esac
