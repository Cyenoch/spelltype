# Verify and build in parallel; publish the exact built image only after both
# succeed, then ask the external platform to deploy it on real main pushes.
# The API request only triggers Coolify: this workflow never replaces
# containers, runs migrations or verifies production itself.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: spelltype:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_ID=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/spelltype-image.tar
          cache-from: type=gha,scope=spelltype-amd64
          cache-to: type=gha,mode=max,scope=spelltype-amd64
      - name: Stage image for publication
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: spelltype-image
          path: ${{ runner.temp }}/spelltype-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [verify, image]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spelltype-image
          path: ${{ runner.temp }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/spelltype-image.tar
          IMAGE_TAGS: ${{ needs.image.outputs.tags }}
        run: |
          docker load --input "$IMAGE_ARCHIVE"
          while IFS= read -r tag; do
            docker tag spelltype:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          first_tag="${IMAGE_TAGS%%$'\n'*}"
          image_ref="$(docker image inspect "$first_tag" --format '{{json .RepoDigests}}' |
            jq -er --arg repository "${first_tag%:*}" '.[] | select(startswith($repository + "@"))')"
          {
            echo '## Published image'
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            printf '%s\n' "$image_ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Ask Coolify to pull and deploy the GHCR image just published.
  # The deploy-only API token lives only in the repository secret.
  # Tags, PRs and manual runs do not deploy; preserve main concurrency.
  deploy:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ] || [ -z "${COOLIFY_URL:-}" ] || [ -z "${COOLIFY_APPLICATION_UUID:-}" ]; then
            echo "::error::Set COOLIFY_TOKEN secret and COOLIFY_URL / COOLIFY_APPLICATION_UUID repository variables."
            exit 1
          fi
          case "$COOLIFY_URL" in
            https://*) ;;
            *) echo "::error::COOLIFY_URL must use HTTPS."; exit 1 ;;
          esac
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          # Do not retry a deployment request: a timeout can occur after it was queued.
          # Never print response bodies, credentials, endpoint URLs or curl diagnostics.
          if ! status="$(jq -cn --arg uuid "$COOLIFY_APPLICATION_UUID" '{uuid: $uuid, force: true}' |
            curl --silent --output "$response_file" --write-out '%{http_code}' \
              --user-agent 'curl/8.5.0' --request POST \
              --connect-timeout 15 --max-time 60 \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              --header 'Content-Type: application/json' --data-binary @- \
              "${COOLIFY_URL%/}/api/v1/deploy" 2>/dev/null)"; then
            echo "::error::Coolify deployment request failed or timed out; check Coolify before retrying."
            exit 1
          fi
          case "$status" in
            2??) ;;
            *) echo "::error::Coolify rejected the deployment request (HTTP $status)."; exit 1 ;;
          esac
          # Coolify can return HTTP 200 without a queued deployment (e.g. authorization
          # denied). Require an application-specific deployment identifier, not just 2xx.
          if ! jq -e --arg uuid "$COOLIFY_APPLICATION_UUID" \
            '.deployments | type == "array" and any(.[]; .resource_uuid == $uuid and (.deployment_uuid | type == "string" and length > 0))' \
            "$response_file" >/dev/null 2>&1; then
            echo "::error::Coolify did not confirm a deployment for the configured application."
            exit 1
          fi
          echo "Coolify accepted the deployment request (HTTP $status); follow its deployment status in Coolify."
