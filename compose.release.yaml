# One immutable game runtime per release, managed exclusively by
# scripts/release.mjs:
#
#   SPELLTYPE_RELEASE_ID    32 lowercase hex release identity
#   SPELLTYPE_GAME_PROJECT  compose project name, <base>-game-<releaseId>
#   SPELLTYPE_RUNTIME_NETWORK  the base stack's shared network
#   SPELLTYPE_GAME_IMAGE    spelltype/release:<releaseId> (local, verified
#                           against the snapshot's recorded image id)
#
# The container joins the base stack's runtime network with the
# deterministic alias game-<releaseId>, which is what the static edge
# regexp route and the API health probe target. No ports are published:
# game traffic enters through the edge and internal revocation goes over
# game-<releaseId>:3001.
#
# The image manifest pins the release identity; SPELLTYPE_RELEASE_ID is
# still set so a stale image/env combination fails loudly instead of
# serving under the wrong version.
name: ${SPELLTYPE_GAME_PROJECT:?game compose project required}

networks:
  runtime:
    external: true
    name: ${SPELLTYPE_RUNTIME_NETWORK:?runtime network required}

secrets:
  database_url:
    file: ${SPELLTYPE_STATE_DIR}/secrets/database_url
  release_admin_token:
    file: ${SPELLTYPE_STATE_DIR}/secrets/release_admin_token
  deepseek_api_key:
    file: ${SPELLTYPE_STATE_DIR}/secrets/deepseek_api_key

services:
  game:
    image: ${SPELLTYPE_GAME_IMAGE:?release image required}
    restart: unless-stopped
    init: true
    # Same uid the release CLI used to create the secret files, so 0600
    # secrets stay owner-only and still readable inside the container.
    user: '${SPELLTYPE_UID:-1000}:${SPELLTYPE_GID:-1000}'
    environment:
      HOME: /tmp
      SERVER_ROLE: game
      SPELLTYPE_RELEASE_ID: ${SPELLTYPE_RELEASE_ID:?release id required}
      DATABASE_URL_FILE: /run/secrets/database_url
      HOST: 0.0.0.0
      PORT: '3000'
      ADMIN_PORT: '3001'
      PUBLIC_ORIGIN: ${SPELLTYPE_PUBLIC_ORIGIN:?set SPELLTYPE_PUBLIC_ORIGIN in deploy/compose.env}
      RELEASE_ADMIN_TOKEN_FILE: /run/secrets/release_admin_token
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      MATCH_ADMISSION: ${MATCH_ADMISSION:-open}
      INPUT_POLICY_MODE: ${INPUT_POLICY_MODE:-observe}
    secrets:
      - database_url
      - release_admin_token
      - deepseek_api_key
    networks:
      runtime:
        aliases:
          - game-${SPELLTYPE_RELEASE_ID:?release id required}
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/api/releases/' + process.env.SPELLTYPE_RELEASE_ID + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
