# Single-runtime production stack: one immutable spelltype image (app plus
# one-shot migration and maintenance entries, all from the same image) and
# PostgreSQL. There is no edge, no per-release containers, no admin listener
# and no Docker socket: at most one app container runs at a time, and
# scripts/deploy.ts serializes every deploy, rollback and bootstrap against
# the durable maintenance state in PostgreSQL.
#
# Public surface: Dokploy (or any reverse proxy on the compose network) routes
# its domain to app:3000; the plain-Compose loopback port mapping exists for
# the host-side CLI's public /health and /api/status probes. Maintenance
# operations use host Docker privilege (`docker compose exec -T app bun
# dist/server/maintenance.js ...`). Optional compose.ops.yaml enables the
# maintenance-only CI bearer API. Credentials reach containers as file secrets
# under SPELLTYPE_STATE_DIR/secrets; no variable has a default password.
#
# Operator runbook: docs/deployment.md; settings: deploy/compose.env.example.
# The deploy CLI always passes
# SPELLTYPE_APP_IMAGE (an exact image ID) via the process environment, which
# overrides deploy/compose.env — an operator running docker compose directly
# must set SPELLTYPE_APP_IMAGE themselves (image IDs, never mutable tags).
name: ${SPELLTYPE_PROJECT:-spelltype}

volumes:
  postgres_data:

secrets:
  database_url:
    file: ${SPELLTYPE_STATE_DIR}/secrets/database_url
  postgres_password:
    file: ${SPELLTYPE_STATE_DIR}/secrets/postgres_password
  wechat_bridge_app_key:
    file: ${SPELLTYPE_STATE_DIR}/secrets/wechat_bridge_app_key
  deepseek_api_key:
    file: ${SPELLTYPE_STATE_DIR}/secrets/deepseek_api_key

services:
  app:
    # Pinned by scripts/deploy.ts to the exact image ID it verified; a bare
    # `docker compose up` must export SPELLTYPE_APP_IMAGE=<sha256:...> itself.
    image: ${SPELLTYPE_APP_IMAGE:?set SPELLTYPE_APP_IMAGE to an exact image ID (scripts/deploy.ts deploy does this automatically)}
    restart: unless-stopped
    init: true
    # Same uid/gid the deploy CLI used to create the 0600 secret files, so
    # they stay owner-only and remain readable inside the container.
    user: '${SPELLTYPE_UID:-1000}:${SPELLTYPE_GID:-1000}'
    environment:
      HOME: /tmp
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      HOST: 0.0.0.0
      PORT: '3000'
      PUBLIC_ORIGIN: ${SPELLTYPE_PUBLIC_ORIGIN:?set SPELLTYPE_PUBLIC_ORIGIN in deploy/compose.env}
      WECHAT_BRIDGE_BASE_URL: ${WECHAT_BRIDGE_BASE_URL:?set WECHAT_BRIDGE_BASE_URL in deploy/compose.env}
      # Public per-App identifier from the xsg-website /developers portal; the
      # App Key itself never passes through compose interpolation or the env.
      WECHAT_BRIDGE_APP_ID: ${WECHAT_BRIDGE_APP_ID:?set WECHAT_BRIDGE_APP_ID in deploy/compose.env}
      WECHAT_BRIDGE_APP_KEY_FILE: /run/secrets/wechat_bridge_app_key
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      INPUT_POLICY_MODE: ${INPUT_POLICY_MODE:-observe}
      # Empty/false uses the connection IP; true trusts X-Forwarded-For;
      # a header name (e.g. EO-Client-IP) trusts that ingress-controlled header.
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-true}
    depends_on:
      database:
        condition: service_healthy
    secrets:
      - database_url
      - wechat_bridge_app_key
      - deepseek_api_key
    ports:
      # Loopback only: the deploy CLI's public /health and /api/status probes.
      # Dokploy domain routing reaches app:3000 over the internal network and
      # never uses this; move it if the host port is taken. There is no admin
      # listener: maintenance runs one-shot inside the app container via
      # `docker compose exec` using host Docker privilege (see
      # scripts/deploy.ts), and in-app administration is the WeChat admin
      # role on /api/admin/maintenance.
      - '127.0.0.1:${SPELLTYPE_APP_HOST_PORT:-3000}:3000'
    # /health is 200 only while the live runtime lease and the database are
    # reachable — including during maintenance draining — so this healthcheck
    # never lies while games are still finishing.
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  # One-shot forward migration; same immutable image as app, so the schema is
  # never moved by different code than the app that starts afterwards. Run via
  # scripts/deploy.ts (docker compose run --rm migrate); it is never running
  # at the same time as an app container in a healthy deployment. The entry
  # applies forward migrations and ensures durable draining afterwards.
  # It never reopens admission; data transformations belong to the migrations.
  migrate:
    image: ${SPELLTYPE_APP_IMAGE:?set SPELLTYPE_APP_IMAGE to an exact image ID (scripts/deploy.ts deploy does this automatically)}
    profiles: [migrate]
    init: true
    user: '${SPELLTYPE_UID:-1000}:${SPELLTYPE_GID:-1000}'
    environment:
      HOME: /tmp
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
    command: ['bun', 'dist/server/migrate.js']
    secrets:
      - database_url
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spelltype}
      POSTGRES_DB: ${POSTGRES_DB:-spelltype}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
